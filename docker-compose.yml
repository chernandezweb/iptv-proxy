services:
  iptv-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iptv-proxy
    restart: unless-stopped
    ports:
      # Host:Container port. Customize via PORT in .env without modifying this file.
      - "${PORT:-8080}:8080"
    volumes:
      # Persistent storage for provider.json, users.json, and filters.json across restarts & updates
      - ./data:/data
      # Mount Docker socket to enable 1-Click Update from the Web Admin dashboard
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PORT: 8080
      DATA_DIR: "/data"
      GIN_MODE: release
      # Initial fallback credentials (can also be customized in .env or Web UI -> Users)
      # Uses ADMIN_USER / ADMIN_PASSWORD to avoid collision with Linux system $USER variable (e.g. root)
      USER: "${ADMIN_USER:-admin}"
      PASSWORD: "${ADMIN_PASSWORD:-admin}"
      HOSTNAME: "${HOSTNAME:-}"
